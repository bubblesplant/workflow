name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      commit: ${{ steps.freshness.outputs.commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verify the tested commit is current main
        id: freshness
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          echo "commit=$current_sha" >> "$GITHUB_OUTPUT"
          if [[ "$TRIGGER_EVENT" == "workflow_dispatch" || "$current_sha" == "$TESTED_SHA" ]]; then
            echo "is-current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI result for $TESTED_SHA; main is $current_sha."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.freshness.outputs.is-current == 'true'
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.is-current == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        if: steps.freshness.outputs.is-current == 'true'
      - run: pnpm ready
        if: steps.freshness.outputs.is-current == 'true'
      - name: Version packages or publish to npm
        id: changesets
        if: steps.freshness.outputs.is-current == 'true' && env.NPM_TOKEN != ''
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
          version-script: pnpm version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create version PR
        if: steps.freshness.outputs.is-current == 'true' && env.NPM_TOKEN == ''
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.release.outputs.commit }}
