packages:
  - apps/*
  - apps/*/*
  - packages/*
  - packages/*/*

catalogMode: prefer

catalog:
  "@flowgram.ai/fixed-layout-editor": 1.0.16
  "@ant-design/icons": ^6.3.4
  "@antfu/eslint-config": ^10.0.0
  "@changesets/cli": ^3.0.3
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-vue": ^6.0.10
  "@vue-flow/core": ^1.48.2
  "@vueuse/core": ^15.0.0
  antdv-next: ^1.8.1
  antd: ^6.7.0
  eslint: ^10.14.0
  react: ^19.3.1
  react-dom: ^19.3.1
  # vue-tsc / Volar 和 typescript-eslint 暂不支持 TypeScript 7。
  typescript: ^6.0.3
  unplugin-vue: ^8.0.1
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  vitepress: 2.0.0-alpha.21
  vue: ^3.5.45
  vue-tsc: ^3.3.14
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - vite-plus@1.6.0
  - unplugin-vue@8.0.1
  - "@oxlint/binding-darwin-x64@1.93.0"
  - "@oxlint/binding-freebsd-x64@1.93.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.93.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.93.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.93.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.93.0"
  - "@oxlint/binding-linux-riscv64-musl@1.93.0"
  - "@oxlint/binding-linux-s390x-gnu@1.93.0"
  - "@oxlint/binding-linux-x64-gnu@1.93.0"
  - "@oxlint/binding-linux-x64-musl@1.93.0"
  - "@oxlint/binding-win32-ia32-msvc@1.93.0"
  - "@oxlint/binding-win32-x64-msvc@1.93.0"
  - "@oxlint/plugins@1.93.0"
  - oxlint@1.93.0
allowBuilds:
  vue-demi: true
